---
"name": "Deploy"
"on":
  "workflow_call":
    "secrets":
      "REPO_TOKEN":
        "required": true
"permissions": {}
"concurrency":
  "group": "Deploy-${{ github.ref }}"
  "cancel-in-progress": false
"defaults":
  "run":
    "shell": "bash"
"env":
  "PYTHONDONTWRITEBYTECODE": 1
  "UV_NO_SYNC": 1
"run-name": "Deploy"
"jobs":
  "documentation":
    "name": "Documentation"
    "permissions":
      "contents": "read"
      "id-token": "write"
      "pages": "write"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@main"
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@main"
        "with":
          "python-version": "3.14"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Build Documentation"
        "id": "build-documentation"
        "run": "uv run zensical build"
      -
        "name": "Configure Pages"
        "id": "configure-pages"
        "uses": "actions/configure-pages@main"
        "with":
          "enablement": "true"
          "token": "${{ secrets.REPO_TOKEN }}"
      -
        "name": "Upload Documentation"
        "id": "upload-documentation"
        "uses": "actions/upload-pages-artifact@main"
        "with":
          "path": "site"
      -
        "name": "Deploy Documentation"
        "id": "deploy-documentation"
        "uses": "actions/deploy-pages@main"
  "container-image":
    "name": "Container Image"
    "permissions":
      "contents": "read"
      "packages": "write"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@main"
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@main"
        "with":
          "python-version": "3.14"
      -
        "name": "Install Container Engine"
        "id": "install-container-engine"
        "uses": "redhat-actions/podman-install@main"
      -
        "name": "Login Container Registry"
        "id": "login-container-registry"
        "run": |-
          podman \
          login \
          ghcr.io \
          --username=${{ github.actor }} \
          --password=${{ secrets.GITHUB_TOKEN }}
      -
        "name": "Build Container Image"
        "id": "build-container-image"
        "run": |-
          podman \
          build \
          --tag=ghcr.io/winipedia/pyrig-containers:$(uv version --short) \
          --tag=ghcr.io/winipedia/pyrig-containers:latest \
          .
      -
        "name": "Push Container Image Version"
        "id": "push-container-image-version"
        "run": |-
          podman \
          push \
          ghcr.io/winipedia/pyrig-containers:$(uv version --short)
      -
        "name": "Push Container Image Latest"
        "id": "push-container-image-latest"
        "run": "podman push ghcr.io/winipedia/pyrig-containers:latest"
  "package":
    "name": "Package"
    "permissions":
      "contents": "read"
      "id-token": "write"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        "uses": "actions/checkout@main"
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        "uses": "astral-sh/setup-uv@main"
        "with":
          "python-version": "3.14"
      -
        "name": "Build Package"
        "id": "build-package"
        "run": "uv build"
      -
        "name": "Publish Package"
        "id": "publish-package"
        "run": "uv publish --trusted-publishing=always"
...
